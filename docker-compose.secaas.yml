# docker-compose.secaas.yml

services:
  attestation-db:
    image: postgres:12
    container_name: attestation-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # - ./postgresql_data:${PGDATA}
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - PGDATA=${PGDATA}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - secaas-net

  secaas:
    container_name: secaas
    image: secaas:latest
    environment:
      - CONFIG_PATH=/config/secaas.json
      - AUTO_START=${AUTO_START}
      - WAIT_FOR_TX_CONFIRMATIONS=${WAIT_FOR_TX_CONFIRMATIONS}
      - EVENT_CONFIRMATIONS=${EVENT_CONFIRMATIONS}
      - EVENT_POLL_INTERVAL=${EVENT_POLL_INTERVAL}
      - EVENT_BATCH_SIZE=${EVENT_BATCH_SIZE}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_HOST=attestation-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - attestation-db
    volumes:
      - ./config/secaas.json:/config/secaas.json
      - "./ref-measurements/:/ref-measurements:rw"
      - ./dockerfiles/secaas/app:/src/app
      - ./checkpoints/secaas:/checkpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - secaas-net

networks:
  secaas-net:
    driver: bridge
    name: secaas-net