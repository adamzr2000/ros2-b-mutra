genesis-file="/config/genesis.json"
node-private-key-file="/opt/besu/keys/nodekey"
logging="INFO"
data-path="/opt/besu/data"
host-allowlist=["*"]
min-gas-price=0

# rpc: HTTP for calls and transactions, WebSocket for new-block notifications
# (eth_subscribe newHeads) to the sidecars and the SECaaS
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-cors-origins=["*"]
# Each sidecar keeps 2-3 connections and robots are spread over the 4 nodes:
# at 128 robots a node needs about 100, above Besu's default of 80.
rpc-http-max-active-connections=400
rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-port=8546
rpc-ws-api=["ETH","NET","WEB3"]
# One subscription per sidecar, robots spread over the 4 nodes.
rpc-ws-max-active-connections=400

# metrics (scraped by Prometheus with ./start.sh --dashboards)
metrics-enabled=true
metrics-host="0.0.0.0"
metrics-port=9545

# permissions
permissions-nodes-config-file-enabled=true
permissions-nodes-config-file="/config/permissions_config.toml"

# peers: the four validators know each other from static-nodes.json, no discovery
static-nodes-file="/config/static-nodes.json"
discovery-enabled=false
