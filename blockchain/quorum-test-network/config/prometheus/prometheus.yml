global:
  scrape_interval:     15s
  evaluation_interval: 15s

# The four QBFT validators: the only Besu nodes of this network.
scrape_configs:
    - job_name: validator1
      static_configs:
        - targets: [ validator1:9545 ]

    - job_name: validator2
      static_configs:
        - targets: [ validator2:9545 ]

    - job_name: validator3
      static_configs:
        - targets: [ validator3:9545 ]

    - job_name: validator4
      static_configs:
        - targets: [ validator4:9545 ]
